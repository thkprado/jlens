# Version updates, a pull request a week per place; security updates come as soon as an advisory
# is published, past the cooldown. Before a release, CONTRIBUTING.md brings the rest up to date.
version: 2

updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      vscode:
        patterns: ["*"]
    ignore:
      # The floor the extension supports, `engines.vscode`.
      - dependency-name: "@types/vscode"
      # Near the Node.js of that floor, so that the types offer no API it lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # jlens behaves like jsonata-js 2.3.0.
      - dependency-name: jsonata

  - package-ecosystem: npm
    directory: /benches/compare
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      compare:
        patterns: ["*"]
    ignore:
      # jlens behaves like jsonata-js 2.3.0.
      - dependency-name: jsonata

  - package-ecosystem: maven
    directories:
      - /crates/jlens-java/java
      - /benches/compare/java
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      maven:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /crates/jlens-python
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
    # Every action is pinned by commit SHA, its version in a comment, which these updates move
    # together. dtolnay/rust-toolchain has no tags: it is pinned at a commit of master, with the
    # toolchain as its input (`toolchain: 1.88` is the minimum Rust version).
