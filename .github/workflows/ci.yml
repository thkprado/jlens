name: CI

on:
  push:
    branches: [main]
  pull_request:

# Jobs read the repository; a job that needs more asks for it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy -p jlens-core --features tracing
      - name: Fuzz targets build
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --check
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --all-features
      - run: cargo test --workspace
      - name: Generated docs are up to date
        run: cargo xtask gen-docs --check
      - name: Conformance report
        run: cargo xtask conformance
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: conformance-report
          path: tests/conformance/REPORT.md

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: mdbook build docs
      - name: Examples and links of the book
        run: cargo xtask doc-check
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The examples of the book agree with jsonata-js
        working-directory: benches/compare
        run: npm ci && node doc-examples.mjs

  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/download-actionlint.bash" \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash
          bash "$RUNNER_TEMP/download-actionlint.bash" 1.7.12 "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # actionlint runs shellcheck on the scripts of `run` steps when it finds it on PATH, as on
      # the Ubuntu runners; without it, those scripts would go unchecked, so fail instead.
      - run: shellcheck --version
      - run: actionlint -color

  semver:
    name: Semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Compares the public API with the last release on crates.io. A breaking change needs a
      # new minor version in Cargo.toml (see CONTRIBUTING.md). jlens-cli has no library.
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: jlens-core, jlens-schema, jlens-lsp

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # The rust-version of Cargo.toml. `+1.88` overrides rust-toolchain.toml, which selects
      # stable.
      - run: cargo +1.88 check --workspace --all-targets

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Advisories, licenses, bans and sources, as deny.toml configures them.
      - uses: EmbarkStudios/cargo-deny-action@v2

  vscode:
    name: VS Code extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the language server
        run: cargo build -p jlens-cli
      - working-directory: editors/vscode
        run: npm ci
      - name: Grammar (snapshots, the suite's expressions and the book's examples)
        working-directory: editors/vscode
        run: npm test
      - name: Type-check the client
        working-directory: editors/vscode
        run: npm run check
      - name: Extension test (diagnostics, completion and hover from the server)
        working-directory: editors/vscode
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm run test:extension
          else
            npm run test:extension
          fi

  wasm:
    name: Wasm (browser ESM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install wasm-bindgen-cli (the version in Cargo.lock)
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --locked --version "$version"
      - run: cargo clippy -p jlens-wasm --target wasm32-unknown-unknown
      - name: Build and test the package (Node.js, headless Chrome, web editor example)
        run: cargo xtask wasm-test --require-browser --example
      - name: TypeScript declarations
        run: >-
          npx -y -p typescript@5.9.2 tsc --noEmit --strict --target es2022 --module es2022
          --moduleResolution bundler --lib es2022,dom,esnext.disposable
          crates/jlens-wasm/tests/types.ts
      - name: Report package size
        run: ls -l crates/jlens-wasm/pkg/*.wasm

  # The release binaries for every target, built as the Release workflow builds them, so that a
  # target that stops building is found on main and not when a tag is pushed. Not on pull
  # requests: the macOS runners are slow.
  binaries:
    name: Release binaries
    if: github.event_name == 'push'
    uses: ./.github/workflows/binaries.yml
    with:
      name: ${{ github.sha }}
      upload: true

  # The npm packages of the CLI (ADR 0012), built from those archives as the Release workflow
  # builds them, then installed on each OS from the packed tarballs.
  npm-cli:
    name: CLI npm packages
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cargo xtask npm-cli dist
      - uses: actions/upload-artifact@v7
        with:
          name: npm-cli
          path: target/npm-cli/*.tgz
          if-no-files-found: error

  npm-cli-install:
    name: CLI from npm (${{ matrix.os }})
    needs: npm-cli
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: npm-cli
          path: packed
      # jlens-cli with the platform package of the runner; npm skips the other optional
      # dependencies, as it does when it installs from the registry.
      - name: Install the packed packages and run jlens
        shell: bash
        run: |
          platform=$(node -p 'process.platform + "-" + process.arch')
          mkdir project
          cd project
          npm init -y > /dev/null
          npm install --no-audit --no-fund ../packed/jlens-cli-"$platform"-*.tgz ../packed/jlens-cli-[0-9]*.tgz
          npx jlens --version
          test "$(echo '{"a": [1, 2]}' | npx jlens eval "\$sum(a)")" = 3
          code=0
          npx jlens eval 2> /dev/null || code=$?
          test "$code" = 2

  # The VS Code extension's packages (ADR 0013), one per target with its binary from those
  # archives and one without, packed on Linux so that the Unix binaries stay executable. Each
  # OS then installs the package of its platform in VS Code and runs the extension test on it.
  vscode-package:
    name: VS Code packages
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - working-directory: editors/vscode
        run: npm ci
      - run: cargo xtask vscode dist
      - uses: actions/upload-artifact@v7
        with:
          name: vscode
          path: target/vscode/*.vsix
          if-no-files-found: error

  vscode-install:
    name: VS Code package (${{ matrix.os }})
    needs: vscode-package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - working-directory: editors/vscode
        run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: vscode
          path: packed
      - name: Install the package of the runner's platform and run the extension test
        working-directory: editors/vscode
        run: |
          platform=$(node -p 'process.platform + "-" + process.arch')
          JLENS_VSIX=$(echo ../../packed/jlens-"$platform"-*.vsix)
          export JLENS_VSIX
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node test/run-extension.mjs
          else
            node test/run-extension.mjs
          fi

  # The Homebrew formula, written as the Homebrew workflow writes it but pointing at the CI
  # archives (put in /tmp/jlens-dist by the install job), then installed and tested by brew on
  # Linux and macOS from a local tap.
  homebrew:
    name: Homebrew formula
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: sha256sum -- *.tar.gz > SHA256SUMS
        working-directory: dist
      - run: cargo xtask homebrew dist/SHA256SUMS --url file:///tmp/jlens-dist > dist/jlens.rb
      - uses: actions/upload-artifact@v7
        with:
          name: homebrew
          path: |
            dist/jlens.rb
            dist/*.tar.gz
          if-no-files-found: error

  homebrew-install:
    name: CLI from Homebrew (${{ matrix.os }})
    needs: homebrew
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: homebrew
          path: /tmp/jlens-dist
      # Homebrew is installed on the Linux runners, but not on the PATH.
      - name: Install the formula and run its test
        run: |
          if ! command -v brew > /dev/null; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew tap-new --no-git local/jlens
          cp /tmp/jlens-dist/jlens.rb "$(brew --repository local/jlens)/Formula/"
          brew install local/jlens/jlens
          brew test local/jlens/jlens
          jlens --version

  # The container image, built from the CI archives with the Dockerfile of the Release workflow,
  # for the platform of the runner only, then run on Linux x86-64 and ARM64.
  container:
    name: Container image (${{ matrix.arch }})
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { arch: arm64, target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.target }}
          path: dist
      - run: docker build -f crates/jlens-cli/Dockerfile -t jlens dist
      - name: Run jlens in the image
        run: |
          test "$(docker image inspect jlens --format '{{.Architecture}}')" = ${{ matrix.arch }}
          docker run --rm jlens --version
          test "$(echo '{"a": [1, 2]}' | docker run --rm -i jlens eval '$sum(a)')" = 3
          echo '{"a": [1, 2]}' > input.json
          test "$(docker run --rm -v "$PWD:/work" jlens eval -i input.json '$sum(a)')" = 3

  # The Scoop manifest, written as the Scoop workflow writes it but pointing at the CI archive
  # (put in C:\jlens-dist by the install job), then installed by Scoop on Windows.
  scoop:
    name: Scoop manifest
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: sha256sum -- *.zip > SHA256SUMS
        working-directory: dist
      - run: cargo xtask scoop dist/SHA256SUMS --url file:///C:/jlens-dist > dist/jlens.json
      - uses: actions/upload-artifact@v7
        with:
          name: scoop
          path: |
            dist/jlens.json
            dist/*.zip
          if-no-files-found: error

  scoop-install:
    name: CLI from Scoop (windows-latest)
    needs: scoop
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: scoop
          path: C:\jlens-dist
      # Scoop is not installed on the runners; its installer refuses an administrator unless told.
      - name: Install Scoop, then the manifest, and run jlens
        shell: pwsh
        run: |
          Invoke-Expression "& {$(Invoke-RestMethod https://get.scoop.sh)} -RunAsAdmin"
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop install C:\jlens-dist\jlens.json
          jlens --version
          $sum = '{"a": [1, 2]}' | jlens eval '$sum(a)'
          if ($sum -ne '3') { throw "jlens printed $sum" }
