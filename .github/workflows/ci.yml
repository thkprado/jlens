name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy -p jlens-core --features tracing
      - run: cargo test --workspace
      - name: Generated docs are up to date
        run: cargo xtask gen-docs --check
      - name: Conformance report
        run: cargo xtask conformance
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: conformance-report
          path: tests/conformance/REPORT.md

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: mdbook build docs
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    name: Wasm (browser ESM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wasm-bindgen-cli (the version in Cargo.lock)
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --locked --version "$version"
      - run: cargo clippy -p jlens-wasm --target wasm32-unknown-unknown
      - name: Build and test the package (Node.js, headless Chrome, web editor example)
        run: cargo xtask wasm-test --require-browser --example
      - name: TypeScript declarations
        run: >-
          npx -y -p typescript@5.9.2 tsc --noEmit --strict --target es2022 --module es2022
          --moduleResolution bundler --lib es2022,dom,esnext.disposable
          crates/jlens-wasm/tests/types.ts
      - name: Report package size
        run: ls -l crates/jlens-wasm/pkg/*.wasm
