name: CI

on:
  push:
    branches: [main]
  pull_request:

# Jobs read the repository; a job that needs more asks for it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy -p jlens-core --features tracing
      - name: Fuzz targets build
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --check
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets
      - run: cargo test --workspace
      - name: Generated docs are up to date
        run: cargo xtask gen-docs --check
      - name: Conformance report
        run: cargo xtask conformance
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: conformance-report
          path: tests/conformance/REPORT.md

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: mdbook build docs
      - name: Examples and links of the book
        run: cargo xtask doc-check
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The examples of the book agree with jsonata-js
        working-directory: benches/compare
        run: npm ci && node doc-examples.mjs

  semver:
    name: Semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Compares the public API with the last release on crates.io. A breaking change needs a
      # new minor version in Cargo.toml (see CONTRIBUTING.md). jlens-cli has no library, and
      # jlens-lsp has not been released yet.
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: jlens-core, jlens-schema

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # The rust-version of Cargo.toml. `+1.88` overrides rust-toolchain.toml, which selects
      # stable.
      - run: cargo +1.88 check --workspace --all-targets

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Advisories, licenses, bans and sources, as deny.toml configures them.
      - uses: EmbarkStudios/cargo-deny-action@v2

  wasm:
    name: Wasm (browser ESM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install wasm-bindgen-cli (the version in Cargo.lock)
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --locked --version "$version"
      - run: cargo clippy -p jlens-wasm --target wasm32-unknown-unknown
      - name: Build and test the package (Node.js, headless Chrome, web editor example)
        run: cargo xtask wasm-test --require-browser --example
      - name: TypeScript declarations
        run: >-
          npx -y -p typescript@5.9.2 tsc --noEmit --strict --target es2022 --module es2022
          --moduleResolution bundler --lib es2022,dom,esnext.disposable
          crates/jlens-wasm/tests/types.ts
      - name: Report package size
        run: ls -l crates/jlens-wasm/pkg/*.wasm

  # The release binaries for every target, built as the Release workflow builds them, so that a
  # target that stops building is found on main and not when a tag is pushed. Not on pull
  # requests: the macOS runners are slow.
  binaries:
    name: Release binaries
    if: github.event_name == 'push'
    uses: ./.github/workflows/binaries.yml
    with:
      name: ${{ github.sha }}
