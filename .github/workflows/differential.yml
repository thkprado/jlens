name: Differential

# Generated expressions run in jlens and in jsonata-js 2.3.0, which must agree on the result or
# the error code (`cargo xtask differential`; see "Differential testing" in
# docs/src/architecture/conformance.md). Each run draws a new seed, which it prints: a failure is
# reproduced locally with `cargo xtask differential --cases <N> --seed <S>`. Generated regular
# expressions run in jlens-regress and in V8, which must agree on syntax errors and matches
# (`cargo xtask regex-differential`, reproduced the same way; see "The regular expression
# engine" in the same page).

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      cases:
        description: "How many expressions to generate"
        default: "20000"
      regex_cases:
        description: "How many regular expressions to generate"
        default: "20000"
      seed:
        description: "The seed (empty: a new one)"
        default: ""

# Jobs read the repository; a job that needs more asks for it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  differential:
    name: jlens against jsonata-js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install jsonata-js
        working-directory: benches/compare
        run: npm ci
      - name: Compare
        env:
          CASES: ${{ inputs.cases || '20000' }}
          SEED: ${{ inputs.seed }}
        run: cargo xtask differential --cases "$CASES" ${SEED:+--seed "$SEED"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: differential
          path: target/differential/

  regex:
    name: jlens-regress against V8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Compare
        env:
          CASES: ${{ inputs.regex_cases || '20000' }}
          SEED: ${{ inputs.seed }}
        run: cargo xtask regex-differential --cases "$CASES" ${SEED:+--seed "$SEED"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: regex-differential
          path: target/regex-differential/
