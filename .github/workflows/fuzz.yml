name: Fuzz

# Coverage-guided fuzzing of the parser, the evaluator, regular expressions, pictures and the
# language service (cargo-fuzz, libFuzzer; see "Fuzzing" in docs/src/architecture/conformance.md).
# Each target starts from the seeds of `cargo xtask fuzz-seed` and from the corpus of its last run. A crash fails the run and uploads the input
# that caused it: reproduce it on any platform with `cargo xtask fuzz-replay <target> <file>`.

on:
  schedule:
    - cron: "37 4 * * 3"
  workflow_dispatch:
    inputs:
      seconds:
        description: "How long to fuzz each target, in seconds"
        default: "600"

# Jobs read the repository; a job that needs more asks for it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse, parse_recover, evaluate, regex, pictures, language_service]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fuzz -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Seed the corpus
        run: cargo xtask fuzz-seed
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          # Each input is written there before it runs (see `record` in fuzz/src/lib.rs).
          JLENS_FUZZ_LAST_INPUT: ${{ github.workspace }}/fuzz/artifacts/${{ matrix.target }}/last-input
          SECONDS_EACH: ${{ inputs.seconds || '600' }}
        # No sanitizer: jlens forbids `unsafe`, and AddressSanitizer reports false positives
        # when stacker switches stacks. Debug assertions turn arithmetic overflows into panics.
        # The prebuilt cargo-fuzz is a musl build, which would build for its own target.
        run: >-
          mkdir -p "fuzz/artifacts/$TARGET" &&
          cargo +nightly fuzz run "$TARGET" --sanitizer none --debug-assertions
          --target x86_64-unknown-linux-gnu
          -- -max_total_time="$SECONDS_EACH" -timeout=10
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      # A stack overflow kills the process before libFuzzer writes the input: `last-input` holds
      # it then. The corpus goes along, to reproduce a crash that needs a run's history.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/
            fuzz/corpus/${{ matrix.target }}/
