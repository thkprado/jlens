name: Release

# When a version tag (v0.1.0, ...) is pushed, builds the jlens binaries (binaries.yml), then
# publishes the crates to crates.io, and to npm the WebAssembly package and the packages of the
# CLI (ADR 0012), to ghcr.io the container image, and the VS Code extension to the Visual Studio
# Marketplace and Open VSX (ADR 0013), then drafts the GitHub release from CHANGELOG.md with the
# binaries attached. Nothing is published unless every binary builds. The npm packages are
# published with provenance and the binary archives and the image get build attestations, all
# signed through Sigstore with the run's OIDC token. Needs the repository secrets
# CARGO_REGISTRY_TOKEN and NPM_TOKEN, and the environment vscode (CONTRIBUTING.md); the image is
# pushed with the run's GITHUB_TOKEN.
# Run by hand (workflow_dispatch) on an existing tag (gh workflow run release.yml --ref vX.Y.Z),
# it publishes nothing: it builds the binaries of that tag, attests them and drafts its release,
# for a release whose draft failed after publishing. It takes no ref as input: every job builds
# the commit of the tag the run was started on, so no run can check out other code (a fork's
# commit, say) in the cache scope of the default branch.
# See CONTRIBUTING.md for the release checklist.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Jobs read the repository; a job that needs more asks for it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  # A run by hand must be started on a version tag, not on a branch.
  tag:
    name: The run is on a version tag
    runs-on: ubuntu-latest
    steps:
      - run: '[[ "$GITHUB_REF" == refs/tags/v* ]]'

  # Every binary builds before anything is published: a target that fails stops the release
  # while it can still be tagged again.
  binaries:
    needs: tag
    uses: ./.github/workflows/binaries.yml
    with:
      name: ${{ github.ref_name }}
      upload: true

  crates:
    name: crates.io
    needs: binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$TAG"
      - run: cargo test --workspace
      # In dependency order; cargo waits for each crate to appear in the index.
      - run: cargo publish -p jlens-regress
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p jlens-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p jlens-schema
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p jlens-lsp
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p jlens-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm:
    name: npm
    needs: binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # id-token signs the provenance statement of the package.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install wasm-bindgen-cli (the version in Cargo.lock)
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --locked --version "$version"
      - name: Build and test the package
        run: cargo xtask wasm-test --require-browser
      - run: npm publish --provenance --access public
        working-directory: crates/jlens-wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The CLI on npm (ADR 0012): a package per platform holding the binary of its archive, then
  # jlens-cli, which depends on them, so that a published jlens-cli never points to a missing
  # package. A package whose version is already on npm is skipped: re-running the job completes
  # a release that failed halfway through.
  npm-cli:
    name: npm (CLI)
    needs: binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # id-token signs the provenance statements of the packages.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: The tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$TAG"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cargo xtask npm-cli dist
      - name: Publish
        working-directory: target/npm-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=${TAG#v}
          for name in jlens-cli-linux-x64 jlens-cli-linux-arm64 jlens-cli-darwin-x64 \
              jlens-cli-darwin-arm64 jlens-cli-win32-x64 jlens-cli; do
            if [ -n "$(npm view "$name@$version" version 2> /dev/null)" ]; then
              echo "$name@$version is already on npm"
            else
              (cd "$name" && npm publish --provenance --access public)
            fi
          done

  # The container image, ghcr.io/thkprado/jlens: the static Linux binaries of the archives for
  # x86-64 and ARM64 (crates/jlens-cli/Dockerfile), tagged X.Y.Z, X.Y and latest, with a build
  # attestation stored with the repository and pushed to the registry. Pushing a version again
  # replaces its tags.
  container:
    name: Container image
    needs: binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # packages pushes the image; the others sign and store the attestation.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      # The build record would be an artifact of the run, which the github job attaches to the
      # release with the archives.
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the workspace version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$TAG"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-linux-musl"
          path: dist
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # No provenance from buildx: it would add an unknown/unknown platform to the image index;
      # the attestation below replaces it.
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: dist
          file: crates/jlens-cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.minor }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
          annotations: |
            index:org.opencontainers.image.description=The jlens command line: a JSONata engine with evaluation audits
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.licenses=MIT
            index:org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The VS Code extension (ADR 0013) on the Visual Studio Marketplace and Open VSX: a VSIX per
  # target holding the binary of its archive, and one for other platforms, which uses the jlens
  # on the PATH. The Marketplace is reached as a Microsoft Entra ID application, federated
  # with the environment vscode; Open VSX with the token OVSX_PAT when the secret is set, and
  # through trusted publishing (this run's OIDC token) otherwise. A VSIX whose version and target
  # are already on a registry is skipped: re-running the job completes a release that failed
  # halfway through.
  vscode:
    name: VS Code extension
    needs: binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: vscode
    # id-token signs in to Microsoft Entra ID and to Open VSX.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$TAG"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - working-directory: editors/vscode
        run: npm ci
      - run: cargo xtask vscode dist
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # vsce takes the Entra ID token of the Azure CLI, signed in by the previous step.
      - name: Visual Studio Marketplace
        run: >-
          node editors/vscode/node_modules/@vscode/vsce/vsce publish --azure-credential
          --skip-duplicate --packagePath target/vscode/*.vsix
      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.2.0 publish --skip-duplicate --packagePath target/vscode/*.vsix

  github:
    name: GitHub release (draft)
    needs: [crates, npm, npm-cli, container, vscode, binaries]
    # crates, the npm jobs, container and vscode are skipped when the workflow is run by hand.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    # contents creates the release; the others sign and store the attestations.
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask release-notes "$TAG" > notes.md
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: sha256sum -- * > SHA256SUMS
        working-directory: dist
      # A build provenance attestation for each archive listed in SHA256SUMS, stored with the
      # repository (gh attestation verify).
      - uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
      # A draft, published by hand after review (CONTRIBUTING.md).
      - run: >-
          gh release create "$TAG" --draft --verify-tag
          --title "jlens ${TAG#v}" --notes-file notes.md dist/*
        env:
          GH_TOKEN: ${{ github.token }}
