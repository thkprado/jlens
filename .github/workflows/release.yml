name: Release

# When a version tag (v0.1.0, ...) is pushed, builds the jlens binaries (binaries.yml), then
# publishes the crates to crates.io and the WebAssembly package to npm, then drafts the GitHub
# release from CHANGELOG.md with the binaries attached. Nothing is published unless every binary
# builds. Needs the repository secrets CARGO_REGISTRY_TOKEN and NPM_TOKEN.
# Run by hand (workflow_dispatch) with an existing tag, it publishes nothing: it builds the
# binaries of that tag and drafts its release, for a release whose draft failed after publishing.
# See CONTRIBUTING.md for the release checklist.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing version tag (vX.Y.Z) whose binaries and draft release to build"
        required: true

# Jobs read the repository; a job that needs more asks for it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Every binary builds before anything is published: a target that fails stops the release
  # while it can still be tagged again.
  binaries:
    uses: ./.github/workflows/binaries.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      upload: true

  crates:
    name: crates.io
    needs: binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$TAG"
      - run: cargo test --workspace
      # In dependency order; cargo waits for each crate to appear in the index.
      - run: cargo publish -p jlens-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p jlens-schema
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p jlens-lsp
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p jlens-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm:
    name: npm
    needs: binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install wasm-bindgen-cli (the version in Cargo.lock)
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --locked --version "$version"
      - name: Build and test the package
        run: cargo xtask wasm-test --require-browser
      - run: npm publish --access public
        working-directory: crates/jlens-wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github:
    name: GitHub release (draft)
    needs: [crates, npm, binaries]
    # crates and npm are skipped when the workflow is run by hand.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask release-notes "$TAG" > notes.md
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: sha256sum * > SHA256SUMS
        working-directory: dist
      # A draft, published by hand after review (CONTRIBUTING.md).
      - run: >-
          gh release create "$TAG" --draft --verify-tag
          --title "jlens ${TAG#v}" --notes-file notes.md dist/*
        env:
          GH_TOKEN: ${{ github.token }}
