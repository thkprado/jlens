name: Release

# When a version tag (v0.1.0, ...) is pushed, builds the jlens binaries (binaries.yml), then
# publishes the crates to crates.io and the WebAssembly package to npm, then drafts the GitHub
# release from CHANGELOG.md with the binaries attached. Nothing is published unless every binary
# builds. The npm package is published with provenance and the binary archives get build
# attestations, both signed through Sigstore with the run's OIDC token. Needs the repository
# secrets CARGO_REGISTRY_TOKEN and NPM_TOKEN.
# Run by hand (workflow_dispatch) on an existing tag (gh workflow run release.yml --ref vX.Y.Z),
# it publishes nothing: it builds the binaries of that tag, attests them and drafts its release,
# for a release whose draft failed after publishing. It takes no ref as input: every job builds
# the commit of the tag the run was started on, so no run can check out other code (a fork's
# commit, say) in the cache scope of the default branch.
# See CONTRIBUTING.md for the release checklist.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Jobs read the repository; a job that needs more asks for it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  # A run by hand must be started on a version tag, not on a branch.
  tag:
    name: The run is on a version tag
    runs-on: ubuntu-latest
    steps:
      - run: '[[ "$GITHUB_REF" == refs/tags/v* ]]'

  # Every binary builds before anything is published: a target that fails stops the release
  # while it can still be tagged again.
  binaries:
    needs: tag
    uses: ./.github/workflows/binaries.yml
    with:
      name: ${{ github.ref_name }}
      upload: true

  crates:
    name: crates.io
    needs: binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$TAG"
      - run: cargo test --workspace
      # In dependency order; cargo waits for each crate to appear in the index.
      - run: cargo publish -p jlens-regress
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p jlens-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p jlens-schema
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p jlens-lsp
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p jlens-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm:
    name: npm
    needs: binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # id-token signs the provenance statement of the package.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install wasm-bindgen-cli (the version in Cargo.lock)
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --locked --version "$version"
      - name: Build and test the package
        run: cargo xtask wasm-test --require-browser
      - run: npm publish --provenance --access public
        working-directory: crates/jlens-wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github:
    name: GitHub release (draft)
    needs: [crates, npm, binaries]
    # crates and npm are skipped when the workflow is run by hand.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    # contents creates the release; the others sign and store the attestations.
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask release-notes "$TAG" > notes.md
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: sha256sum -- * > SHA256SUMS
        working-directory: dist
      # A build provenance attestation for each archive listed in SHA256SUMS, stored with the
      # repository (gh attestation verify).
      - uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
      # A draft, published by hand after review (CONTRIBUTING.md).
      - run: >-
          gh release create "$TAG" --draft --verify-tag
          --title "jlens ${TAG#v}" --notes-file notes.md dist/*
        env:
          GH_TOKEN: ${{ github.token }}
