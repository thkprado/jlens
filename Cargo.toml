[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.18.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/thkprado/jlens"
homepage = "https://thkprado.github.io/jlens/"
authors = ["jlens contributors"]
description = "A JSONata implementation in Rust with auditing and schema-driven autocomplete"
keywords = ["jsonata", "json", "query", "transform", "rules"]
categories = ["parser-implementations", "encoding", "command-line-utilities", "wasm"]

[workspace.dependencies]
jlens-core = { path = "crates/jlens-core", version = "0.18.0" }
jlens-schema = { path = "crates/jlens-schema", version = "0.18.0" }
jlens-lsp = { path = "crates/jlens-lsp", version = "0.18.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }
foldhash = "0.2"
thiserror = "2"
anyhow = "1"
glob = "0.3"
clap = { version = "4", features = ["derive"] }
libtest-mimic = "0.8"
insta = { version = "1", features = ["json", "redactions"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
assert_cmd = "2"
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
ryu-js = "1"
# The fork of regress whose matches stop within the evaluation's limits (ADR 0009).
regress = { package = "jlens-regress", path = "crates/jlens-regress", version = "0.18.0", default-features = false, features = ["std", "prohibit-unsafe"] }
web-time = "1"
stacker = "0.1"
tracing = "0.1"
# The Python package (ADR 0014): the stable ABI from Python 3.10 (`abi3`), and from 3.15 for
# free-threaded Python (`abi3t`). PyO3 picks the one that fits the interpreter it builds for.
pyo3 = { version = "0.30.1", features = ["abi3-py310", "abi3t-py315"] }
pyo3-build-config = "0.30.1"
scoped-tls-hkt = "0.1.5"
lsp-server = "0.10"
lsp-types = "0.97"
url = "2"
# The global allocator of the CLI only; the library leaves the choice to applications.
mimalloc = "0.1.52"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1

# Against `opt-level = "z"`, `"s"` makes evaluations 5-38% faster for a module 12% larger.
# `3` would be faster still, but its larger frames use more of the JavaScript engine's stack:
# deep recursion then overflows that stack before the depth limit stops it with `D1011`.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
