[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/thkprado/jlens"
homepage = "https://github.com/thkprado/jlens"
authors = ["jlens contributors"]
description = "A JSONata implementation in Rust with auditing and schema-driven autocomplete"
keywords = ["jsonata", "json", "query", "transform", "rules"]
categories = ["parser-implementations", "encoding", "command-line-utilities", "wasm"]

[workspace.dependencies]
jlens-core = { path = "crates/jlens-core", version = "0.5.0" }
jlens-schema = { path = "crates/jlens-schema", version = "0.5.0" }
jlens-lsp = { path = "crates/jlens-lsp", version = "0.5.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }
foldhash = "0.2"
thiserror = "2"
anyhow = "1"
glob = "0.3"
clap = { version = "4", features = ["derive"] }
libtest-mimic = "0.8"
insta = { version = "1", features = ["json", "redactions"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
assert_cmd = "2"
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
ryu-js = "1"
regress = "0.10"
web-time = "1"
stacker = "0.1"
tracing = "0.1"
lsp-server = "0.10"
lsp-types = "0.97"
url = "2"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
