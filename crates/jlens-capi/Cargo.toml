[package]
name = "jlens-capi"
description = "The C API of jlens, called by the Java package through Panama (ADR 0021)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories = ["api-bindings", "encoding"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jlens-core.workspace = true
foldhash.workspace = true
serde.workspace = true
serde_json.workspace = true
scoped-tls-hkt.workspace = true

# mimalloc 2 outside Windows: mimalloc 3.3 crashes on glibc once the thread that loaded the
# library has ended (ADR 0021, the allocator of 0.25 #11).
[target.'cfg(windows)'.dependencies]
mimalloc = { workspace = true, features = ["local_dynamic_tls"] }
[target.'cfg(not(windows))'.dependencies]
mimalloc = { workspace = true, features = ["local_dynamic_tls", "v2"] }

[dev-dependencies]
proptest.workspace = true

# The workspace's lints, with `unsafe_code` at `deny` instead of `forbid`, so that the exports
# module alone can allow it for `#[unsafe(no_mangle)]` (ADR 0021). `forbid` cannot be lowered
# by an inner `allow`. `tests/no_unsafe.rs` checks that nothing else uses the exception.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
