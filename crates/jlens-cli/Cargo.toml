[package]
name = "jlens-cli"
description = "Command-line interface for jlens: evaluate, check and explain JSONata expressions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://thkprado.github.io/jlens/guides/cli.html"
authors.workspace = true
keywords.workspace = true
categories = ["command-line-utilities"]
include = ["src/**/*", "README.md", "LICENSE"]

[[bin]]
name = "jlens"
path = "src/main.rs"

# `cargo binstall jlens-cli` downloads the binary that the Release workflow attaches to the
# GitHub release of the version.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/jlens-{ version }-{ target }.tar.gz"
bin-dir = "jlens-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/jlens-{ version }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
jlens-core.workspace = true
jlens-schema.workspace = true
jlens-lsp.workspace = true
glob.workspace = true
serde_json.workspace = true
anyhow.workspace = true
serde.workspace = true
clap.workspace = true
mimalloc.workspace = true

[lints]
workspace = true

[dev-dependencies]
assert_cmd.workspace = true
insta.workspace = true
