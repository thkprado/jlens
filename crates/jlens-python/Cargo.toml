[package]
name = "jlens-python"
description = "Python bindings for jlens (the `jlens` package on PyPI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories = ["api-bindings", "encoding"]
publish = false

[lib]
name = "_jlens"
crate-type = ["cdylib", "rlib"]
# The code calls the Python interpreter, which a Rust test binary does not load: the package is
# tested with pytest (`tests/`).
test = false
doctest = false

[dependencies]
jlens-core.workspace = true
foldhash.workspace = true
serde_json.workspace = true
pyo3.workspace = true
scoped-tls-hkt.workspace = true

# Its thread-local state through the dynamic model: a module loaded at run time cannot count on
# room for the initial-exec one. mimalloc 2 outside Windows: mimalloc 3.3 crashes on glibc once
# the thread that loaded the module has ended (ADR 0014, follow-up of 0.24.1).
[target.'cfg(windows)'.dependencies]
mimalloc = { workspace = true, features = ["local_dynamic_tls"] }
[target.'cfg(not(windows))'.dependencies]
mimalloc = { workspace = true, features = ["local_dynamic_tls", "v2"] }

[build-dependencies]
pyo3-build-config.workspace = true

[lints]
workspace = true
