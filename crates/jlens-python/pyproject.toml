[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "jlens"
description = "JSONata for Python: a Rust engine with evaluation audits"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jlens contributors" }]
keywords = ["jsonata", "json", "query", "transform", "rules"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://thkprado.github.io/jlens/"
Repository = "https://github.com/thkprado/jlens"

[tool.maturin]
python-source = "python"
module-name = "jlens._jlens"
