# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/), checked in CI.

[graph]
all-features = true

[advisories]
# Vulnerabilities, unsound crates and unmaintained crates fail the check; an exception goes in
# `ignore` with the advisory id and a reason.
ignore = []

[licenses]
# Licenses compatible with distributing jlens under MIT. A dependency may pick any of the
# licenses it offers.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
# xtask is not published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
