<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jlens web editor</title>
  <link rel="stylesheet" href="style.css">
  <!--
    CodeMirror 6 from esm.sh. The `*` prefix leaves every dependency as a bare import, resolved by
    this import map, so that each package is loaded exactly once. `jlens-wasm` is the package
    built in the repository; `cargo xtask site` rewrites this entry to `./pkg/jlens.js`.
  -->
  <script type="importmap">
  {
    "imports": {
      "jlens-wasm": "../../crates/jlens-wasm/pkg/jlens.js",
      "@codemirror/state": "https://esm.sh/*@codemirror/state@6.7.6",
      "@codemirror/view": "https://esm.sh/*@codemirror/view@6.43.13",
      "@codemirror/language": "https://esm.sh/*@codemirror/language@6.12.4",
      "@codemirror/commands": "https://esm.sh/*@codemirror/commands@6.11.1",
      "@codemirror/autocomplete": "https://esm.sh/*@codemirror/autocomplete@6.20.3",
      "@codemirror/lint": "https://esm.sh/*@codemirror/lint@6.9.7",
      "@lezer/common": "https://esm.sh/*@lezer/common@1.5.3",
      "@lezer/highlight": "https://esm.sh/*@lezer/highlight@1.2.4",
      "@lezer/lr": "https://esm.sh/*@lezer/lr@1.4.10",
      "@marijn/find-cluster-break": "https://esm.sh/@marijn/find-cluster-break@1.0.4",
      "style-mod": "https://esm.sh/style-mod@4.1.4",
      "w3c-keyname": "https://esm.sh/w3c-keyname@2.2.8",
      "crelt": "https://esm.sh/crelt@1.0.7"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</head>
<body>
  <header>
    <h1>jlens <span>web editor</span></h1>
    <label class="sample">Example
      <select id="sample"></select>
    </label>
    <button id="share" type="button"
      title="Put the expression, the input document and the bindings in the address">Share</button>
    <p id="share-status" class="hint" role="status"></p>
    <p id="status">Loading…</p>
    <p class="about">Everything runs in your browser: no expression or document leaves it.
      <a href="https://thkprado.github.io/jlens/">The jlens book</a></p>
  </header>

  <main>
    <section class="panel" id="expression-panel">
      <h2>Expression</h2>
      <div id="expression" class="editor"></div>
      <p id="signature" class="hint" aria-live="polite"></p>
      <p class="hint">Ctrl+Space completes fields, variables and functions; hover a path for its
        type. Fields come from a schema inferred from the input document.</p>
    </section>

    <section class="panel" id="input-panel">
      <h2>Input document</h2>
      <textarea id="input" spellcheck="false" aria-label="Input document (JSON)"></textarea>
      <h3>Bindings</h3>
      <textarea id="bindings" class="short" spellcheck="false"
        aria-label="Bindings (a JSON object of variables)"></textarea>
      <p id="input-error" class="error" role="alert"></p>
    </section>

    <section class="panel" id="output-panel">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="result" aria-selected="true">Result</button>
        <button role="tab" data-tab="explanation" aria-selected="false">Explanation</button>
        <button role="tab" data-tab="audit" aria-selected="false">Audit tree</button>
        <button role="tab" data-tab="schema" aria-selected="false">Schema</button>
        <label class="level">Audit
          <select id="level">
            <option value="decisions" selected>decisions</option>
            <option value="full">full</option>
          </select>
        </label>
      </div>
      <div class="tab" id="tab-result"><pre id="result"></pre></div>
      <div class="tab" id="tab-explanation" hidden><ul id="explanation"></ul></div>
      <div class="tab" id="tab-audit" hidden><div id="audit"></div></div>
      <div class="tab" id="tab-schema" hidden><pre id="schema"></pre></div>
    </section>
  </main>
</body>
</html>
