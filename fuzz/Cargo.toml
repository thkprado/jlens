# Coverage-guided fuzzing (cargo-fuzz, nightly). Not a member of the main workspace: it needs
# nightly and libFuzzer. See "Fuzzing" in docs/src/architecture/conformance.md.

[package]
name = "jlens-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", optional = true }
jlens-core = { path = "../crates/jlens-core" }
jlens-schema = { path = "../crates/jlens-schema" }
# As jlens-core depends on it.
regress = { package = "jlens-regress", path = "../crates/jlens-regress", default-features = false, features = ["std", "prohibit-unsafe"] }
serde_json = "1"

[features]
default = ["libfuzzer"]
# The fuzz targets, which link libFuzzer.
libfuzzer = ["dep:libfuzzer-sys"]
# The `replay` program, which does not.
replay = []

# A workspace of its own, so that the main workspace does not claim this crate.
[workspace]
members = ["."]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "parse_recover"
path = "fuzz_targets/parse_recover.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "evaluate"
path = "fuzz_targets/evaluate.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "regex"
path = "fuzz_targets/regex.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "pictures"
path = "fuzz_targets/pictures.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "language_service"
path = "fuzz_targets/language_service.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

# Runs saved inputs through the targets without libFuzzer: `cargo xtask fuzz-replay`.
[[bin]]
name = "replay"
path = "src/replay.rs"
test = false
doc = false
bench = false
required-features = ["replay"]
